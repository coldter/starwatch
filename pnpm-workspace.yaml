packages:
  - "packages/*"
  - "apps/*"
  - "eval-lab"

catalog:
  effect: 4.0.0-rc.112
  "@effect/sql-d1": 4.0.0-rc.112
  "@effect/sql-sqlite-node": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  alchemy: 2.0.0-beta.77
  typescript: 7.0.2
  vitest: 4.1.11
  vite: 8.3.0
  react: 19.3.0
  react-dom: 19.3.0
  "@tanstack/react-router": 1.170.35
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 26.5.1
  "@cloudflare/workers-types": 5.20260911.1
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  motion: 13.4.0
  "lucide-react": 1.47.0
  clsx: 2.1.1
  "tailwind-merge": 3.7.0
  "class-variance-authority": 0.7.1
  "tw-animate-css": 1.4.0
  "next-themes": 0.4.6

# Keep every transitive Effect package on the same RC.
# (pnpm 12 ignores `pnpm.overrides` in package.json — it must live here.)
overrides:
  "@effect/platform-node-shared": 4.0.0-rc.112
  "@effect/sql-d1": 4.0.0-rc.112
  "@effect/sql-sqlite-do": 4.0.0-rc.112

allowBuilds:
  msgpackr-extract: true
  workerd: true
  onnxruntime-node: true
  protobufjs: true
  # eval-lab only extracts text; sharp is optional in @huggingface/transformers (image tasks).
  sharp: false

minimumReleaseAgeExclude:
  - framer-motion@13.4.0
  - lucide-react@1.47.0
  - motion@13.4.0
