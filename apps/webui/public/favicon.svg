<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="starwatch">
  <title>starwatch</title>
  <!-- The icon: the app's near-black page carrying one gold star.
       Raster siblings are generated by the webui `icons` script. -->
  <style>
    .tile {
      fill: #0a0a0a;
    }

    /* A dark tab bar would swallow the near-black tile, so the muted surface
       takes over there; the star carries the identity either way. */
    @media (prefers-color-scheme: dark) {
      .tile {
        fill: #1d1d1d;
      }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <path
    d="M32.00 11.20 L38.35 25.45 L53.87 27.09 L42.28 37.54 L45.52 52.80 L32.00 45.01 L18.48 52.80 L21.72 37.54 L10.13 27.09 L25.65 25.45 Z"
    fill="#ffb417"
    stroke="#ffb417"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
</svg>
